name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # LDC only: libfp refuses DMD at compile time (see its README).
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Run unittests
        run: dub test --compiler=ldc2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check documentation examples
        run: python tools/doctest.py

      - name: Build static library
        run: dub build --config=library --compiler=ldc2

  wasi:
    name: wasm32-wasi (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Threads need thread-local storage on wasm, which LDC releases up to 1.43 strip (ldc-developers/ldc#5268).
          - name: threads
            compiler: ldc-master
            flags: ''
          - name: single-threaded
            compiler: ldc-latest
            flags: --single-threaded

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Run unittests under @emnapi/wasi-threads
        run: python3 tools/wasi.py --node ${{ matrix.flags }}
