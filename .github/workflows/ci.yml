name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.dc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dc: [ldc-latest, dmd-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Run unittests
        run: dub test --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}

      - name: Build static library
        run: dub build --config=library --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}
